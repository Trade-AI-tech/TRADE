name: Collect 15m Gold Bars

# ============================================
# เก็บแท่ง 15 นาทีของทอง (GC=F) วันละครั้ง แล้ว **commit กลับเข้า repo**
#
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ ทำไม workflow นี้ถึงมีอยู่ — และทำไม "commit กลับ" คือทั้งหมดของมัน            │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Yahoo ให้แท่ง 15m ย้อนหลัง **สูงสุด 1 เดือน** (ขอมากกว่านั้นตอบ Unprocessable Entity)
# หนึ่งเดือนแบ่ง train / validation / test ไม่ได้ → เลน 15m ไม่มีทางถูกตรวจสอบนอกตัวอย่าง
# ได้เลย ทุกคำตอบเรื่อง 15m จึงอ่อนตลอดไป เว้นแต่เราจะเริ่มเก็บเอง
# เก็บวันนี้ อีก 3 เดือนก็มี 3 เดือน อีกปีก็มีปี
#
# ถ้า job นี้ไม่ commit ไฟล์กลับเข้า repo ข้อมูลจะหายไปพร้อม runner ทุกรอบ แล้วเราจะได้
# workflow ที่ดูเหมือนทำงาน (เขียวทุกวัน) แต่ไม่เคยสะสมอะไรเลย — นั่นคือความล้มเหลว
# ที่เงียบที่สุดของโครงการนี้ ขั้นตอน commit จึงไม่ใช่ของแถม แต่เป็นเหตุผลที่ไฟล์นี้มีอยู่
#
# ⚠ สิ่งที่ workflow นี้ **ไม่ได้** พิสูจน์: ไม่ได้แปลว่าเลน 15m ทำกำไรหรือจะทำกำไร
#   ผลวิจัยที่มีอยู่ (บน 1H ซึ่งข้อมูลยาวพอวัดได้จริง) คือ ขอบดิบ +0.0064 R · ต้นทุน 0.0948 R
#   → สุทธิ −0.0884 R · ทุกกฎติดลบครบ 21/21 ช่อง · ไม่มีเทคนิคไหนรอด Holm สักตัว
#   ไฟล์นี้เปลี่ยนสถานะเดียว: จาก "วัดไม่ได้เลย" เป็น "อีกหลายเดือนค่อยวัดได้"
#
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ ขนาดไฟล์ — วัดจริงจากรอบแรก (2026-09-01)                                      │
# └──────────────────────────────────────────────────────────────────────────────┘
#
#   หน้าต่างหนึ่งเดือนที่ Yahoo ให้: ดิบ 2,432 แท่ง → ใช้ได้จริง 1,960 แท่ง
#   (ตัด null ที่ Yahoo เติมช่วงตลาดปิด 471 แท่ง + แท่งที่ยังไม่ปิด 1 แท่ง)
#   ไฟล์ที่ได้ 278 KB → **145 ไบต์/แท่ง** · ทองเดินเฉลี่ย 66.9 แท่ง/วันตามปฏิทิน
#
#   ครบ 1 ปี  ≈ 24,400 แท่ง ≈ **3.4 MB**   ← ตัวไฟล์ในโฟลเดอร์ ณ วันนั้น
#   ครบ 5 ปี  ≈ 122,000 แท่ง ≈ 17 MB
#
#   ส่วนประวัติใน git เป็นคนละก้อน: commit วันละใบ ใบละ ~65 แท่ง ≈ 9.5 KB ของข้อความใหม่
#   git เก็บทีละ blob เต็ม แต่ตอน pack มันทำ delta ระหว่างเวอร์ชันที่คล้ายกันมาก
#   → คาดว่าประวัติทั้งปีบวมราวไม่กี่ MB ไม่ใช่ 365 × 3.4 MB (ตัวเลขนี้ยัง "คาด" อยู่
#     ยังไม่ได้วัด — ถ้าวันไหน repo บวมผิดปกติ ให้มาสงสัยตรงนี้ก่อนที่อื่น)
#
#   เทียบกับที่ .gitignore กันไว้: แคชวิจัยที่เหลือรวมกัน 176 MB และ **ดึงใหม่ได้เสมอ**
#   (Yahoo ให้ 1D/1H ย้อนหลังเป็นปี) จึงไม่ commit — ต่างกันที่ข้อนี้ข้อเดียว ไม่ใช่ที่ขนาด
#
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ โควตา GitHub Actions                                                          │
# └──────────────────────────────────────────────────────────────────────────────┘
#   repo นี้เป็น private → ถูกคิดนาที (แผนฟรี 2,000 นาที/เดือน) และปัดขึ้นเป็นนาทีเต็ม/job
#   งานต่อรอบ: checkout ~3 วิ + setup-node ~2 วิ + ลง typescript ~5 วิ + ดึง+ผสาน ~3 วิ
#   + commit/push ~2 วิ ≈ 15 วิ → คิด 1 นาที/วัน = **~30 นาที/เดือน**
#   (scan-universe กินราว 770 นาที/เดือน — ตัวนี้จึงเป็นเศษเสี้ยว)
# ============================================

on:
  schedule:
    # 21:40 UTC ทุกวัน — เลือกเวลานี้ด้วยเหตุผลสามข้อ
    #
    #   1. ไม่ชนกับ workflow อื่นที่มีอยู่
    #        scan-universe.yml ยิงนาทีที่ 2,17,32,47 **ของทุกชั่วโมง** → นาทีที่ 40 ห่างที่สุด
    #          ที่ยังลงตัว (ห่างรอบก่อน 8 นาที · ห่างรอบถัดไป 7 นาที)
    #        fetch-news.yml ยิงนาทีที่ 5 ของชั่วโมง 0,4,8,12,16,20 → ชั่วโมง 21 ไม่อยู่ในชุดนั้น
    #      ชนกันแล้วสอง job แย่ง runner กันเอง ไม่ได้พัง แต่หน่วงทั้งคู่โดยไม่จำเป็น
    #
    #   2. เป็นเวลาที่ "วันซื้อขายของทองจบแล้ว" — CME ปิดรอบวันละครั้งตอน 17:00 ET
    #      (= 21:00 UTC ช่วง EDT / 22:00 UTC ช่วง EST) แล้วเปิดใหม่อีกชั่วโมงถัดไป
    #      ช่วง EDT เวลานี้ตกอยู่ในช่วงพักพอดี ส่วนช่วง EST จะเป็น ~20 นาทีก่อนพัก
    #      ทั้งสองกรณีไม่กระทบความถูกต้อง เพราะตัวเก็บตัดแท่งที่ยังไม่ปิดทิ้งอยู่แล้ว
    #      (ดู parseChart ใน scripts/collect-15m.mjs) — ข้อนี้แค่ทำให้ได้แท่งของวันครบที่สุด
    #
    #   3. ไม่ใช่ต้นชั่วโมง ซึ่งเป็นช่วงที่ GitHub บอกเองว่าคิวยาวและดีเลย์สูงสุด
    #
    # ⚠ ดีเลย์ของ GitHub ไม่กระทบอะไรเลยในงานนี้ ต่างจาก scan-universe — เพราะหน้าต่างที่ขอ
    #   คือ 1 เดือน รอบที่ช้าไปหลายชั่วโมงก็ยังได้แท่งชุดเดียวกัน สิ่งเดียวที่ทำให้ข้อมูลหาย
    #   จริง ๆ คือ "ไม่ได้รันเลยติดต่อกันเกิน 30 วัน" (โควตาหมด / repo ปิด Actions)
    # ⚠ schedule มีผลเฉพาะไฟล์ที่อยู่บน branch หลัก — แก้บน branch อื่นแล้วยังไม่มีผล
    - cron: '40 21 * * *'

  # กดเองได้ เผื่ออยากเก็บก่อนถึงรอบ (เช่นรู้ตัวว่าโควตาจะหมด หรือเพิ่งแก้ตัวเก็บ)
  workflow_dispatch:

# ต้องมี ไม่งั้น push กลับ repo ไม่ได้ (GITHUB_TOKEN ปริยายเป็นสิทธิ์อ่านอย่างเดียว)
permissions:
  contents: write

# กันสองรอบเขียนไฟล์เดียวกันพร้อมกัน — ถ้าซ้อนกัน รอบหลังจะ push ทับสิ่งที่รอบแรกเพิ่งใส่
concurrency:
  group: collect-15m
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # วัดจริง ~15 วิ — ตั้ง 10 นาทีเผื่อ Yahoo ตอบช้าแล้วตัวเก็บถอยรอ retry ครบทุกยก
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # ต้อง checkout จริงเพราะตัวเก็บอ่าน src/lib/candle-sanitizer.ts ตัวจริงมาใช้
          # และเพราะเราจะ commit ไฟล์กลับเข้า branch นี้
          # ประวัติเก่าไม่ได้ใช้ → depth 1 พอ (เร็วกว่าและไม่กินแบนด์วิดท์)
          fetch-depth: 1
          # ปล่อยให้ actions/checkout ฝัง GITHUB_TOKEN ไว้ให้ (ค่าปริยาย) — ขั้นตอน push
          # ข้างล่างจึงไม่ต้องตั้ง remote หรือ token เองเลย
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          # 22 ให้ตรงกับ scan-universe.yml — ตัวเก็บใช้ fetch ในตัวของ node
          node-version: '22'

      - name: ติดตั้ง typescript ตัวเดียว (ไม่ใช่ npm ci ทั้งโปรเจกต์)
        # ตัวเก็บต้องลอกชนิดออกจาก src/lib/candle-sanitizer.ts แล้ว import กลับเข้ามา
        # (scripts/research/load-src-modules.mjs) — typescript จึงเป็นแพ็กเกจเดียวที่ต้องมี
        # `npm ci` จะลง next/react/recharts ทั้งชุดแล้วดันเวลา job ข้าม 60 วิ = โดนคิด 2 นาที
        run: npm install --no-save --no-audit --no-fund --loglevel=error typescript

      - name: ดึงแท่ง 15m แล้วผสานลงแคชสะสม
        # ล้มเมื่อไหร่ job แดงทันที (ตัวเก็บ exit != 0 ทุกเส้นทางที่ดึงไม่สำเร็จ)
        # ซึ่งเป็นสิ่งที่ต้องการ — รอบเก็บที่ล้มแล้วเงียบคือทางเดียวที่คลังนี้จะว่างเปล่า
        # โดยไม่มีใครรู้ตัวจนวันที่เอาไปวิจัย
        run: node scripts/collect-15m.mjs

      - name: commit ไฟล์แคชกลับเข้า repo
        env:
          CACHE_FILE: .research-cache/candles/GOLD__XAUUSD__15m.json
        run: |
          set -euo pipefail

          # ทำไมใช้ `git status --porcelain` ไม่ใช่ `git diff --quiet`:
          # รอบแรกสุดไฟล์ยังไม่ถูก track เลย `git diff` จึงมองไม่เห็นมันและจะข้ามการ commit
          # ตลอดไป — ทั้งโครงการจะเงียบสนิทตั้งแต่วันแรก porcelain เห็นทั้งของใหม่และของแก้
          if [ -z "$(git status --porcelain -- "$CACHE_FILE")" ]; then
            echo "ไม่มีแท่งใหม่ในรอบนี้ — ไม่สร้าง commit เปล่า"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$CACHE_FILE"

          BARS=$(node -e "console.log(require('./$CACHE_FILE').bars)")
          TO=$(node -e "console.log(require('./$CACHE_FILE').actualTo)")

          # [skip ci] กัน deploy.yml (npm ci + build + เทสต์ทั้งชุด) ไม่ให้รันทุกวันเพราะ
          # commit ข้อมูลใบนี้ — จะกินโควตาเดือนละหลักร้อยนาทีโดยไม่ได้ตรวจอะไรใหม่เลย
          # (ปกติ push ที่ใช้ GITHUB_TOKEN ก็ไม่ปลุก workflow อื่นอยู่แล้ว นี่คือชั้นที่สอง
          #  เผื่อวันไหนมีคนเปลี่ยนไปใช้ PAT ซึ่งปลุก workflow ได้)
          git commit -m "เก็บแท่ง 15m ของทองถึง $TO (สะสม $BARS แท่ง) [skip ci]"

          # ชนกับ commit อื่นบน main ได้ถ้าเจ้าของเพิ่ง push พอดี — ดึงมา rebase แล้วลองใหม่
          # ครั้งเดียว ถ้ายังไม่ผ่านให้ job แดงไปเลย **ห้าม push -f ทับงานคนอื่นเด็ดขาด**
          # แดงหนึ่งวันไม่ทำให้ข้อมูลหาย เพราะหน้าต่างที่ Yahoo ให้คือ 1 เดือน
          # รอบพรุ่งนี้ดึงแท่งชุดเดิมกลับมาได้ครบ (จะหายจริงต้องไม่ได้รันติดกันเกิน 30 วัน)
          git push || {
            echo "push ชนกับ commit อื่น — ดึงมา rebase แล้วลองอีกครั้ง"
            git pull --rebase --autostash
            git push
          }

      - name: สรุปให้เห็นในหน้า run (ไม่ต้องเปิด log)
        if: always()
        run: |
          {
            echo "### เก็บแท่ง 15m ของทอง"
            echo ''
            echo "- สถานะรอบนี้: ${{ job.status }} (ถ้าไม่ใช่ success ตัวเลขข้างล่างคือของรอบก่อน)"
            if [ -f .research-cache/candles/GOLD__XAUUSD__15m.json ]; then
              node -e "
                const j = require('./.research-cache/candles/GOLD__XAUUSD__15m.json');
                const kinds = Object.entries(j.coverage.gapsByKind ?? {}).map(([k, v]) => k + ' ' + v).join(' · ');
                console.log('- สะสม **' + j.bars + '** แท่ง · ครอบคลุม ' + j.coverage.spanDays + ' วัน');
                console.log('- ช่วง ' + j.actualFrom + ' → ' + j.actualTo);
                console.log('- ช่องโหว่ ' + j.coverage.gapCount + ' จุด (' + kinds + ') · อธิบายไม่ได้ ' + j.coverage.unexplainedGaps.length + ' จุด');
              "
            else
              echo '- ไม่มีไฟล์แคช — รอบนี้ดึงไม่สำเร็จ'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
