name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ============================================
  # Step 1: Lint & Build Check
  # ============================================
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_DEMO_MODE: 'false'

  # ============================================
  # Step 2: ตรวจว่ามี secrets ครบไหม
  #
  # ทั้งสอง job ข้างล่างไม่เคยรันสำเร็จเลยตั้งแต่ commit แรก เพราะ lint พังก่อน
  # พอ lint ผ่านแล้วมันจะเริ่มรันจริง และล้มทันทีเพราะ secrets ว่าง
  # จึงกันไว้ให้ข้ามไปเงียบ ๆ แทนที่จะทำให้ CI แดงค้าง
  # ถ้าวันไหนใส่ secrets ครบ job เดิมจะกลับมาทำงานเองโดยไม่ต้องแก้อะไร
  #
  # ⚠ repo นี้ยังไม่ได้เชื่อม Vercel Git integration (ต้อง authorize Vercel กับ GitHub ก่อน)
  #   ตอนนี้ deploy ด้วยมือจากเครื่อง: npx vercel deploy --prod
  #   ถ้าเชื่อม Git integration แล้ว Vercel จะ deploy เองทุก push และ job ข้างล่างก็ไม่จำเป็น
  # ============================================
  check-secrets:
    needs: lint-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      has_supabase: ${{ steps.check.outputs.has_supabase }}
      has_vercel: ${{ steps.check.outputs.has_vercel }}
    steps:
      - id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "has_supabase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_supabase=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ข้าม deploy-supabase — ยังไม่ได้ตั้ง SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF"
          fi
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vercel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ข้าม deploy-vercel — ยังไม่ได้ตั้ง VERCEL_TOKEN และยังไม่ได้เชื่อม Git integration ต้อง deploy ด้วยมือ: npx vercel deploy --prod"
          fi

  # ============================================
  # Step 3: Deploy Supabase (DB migrations)
  #
  # 002_trading_schema.sql รันซ้ำได้ปลอดภัยแล้ว — ทุก CREATE เป็น IF NOT EXISTS
  # และไม่มี DROP TABLE ของตารางฝั่งเทรดเหลืออยู่
  # ถ้าจะเพิ่ม migration ใหม่ ให้รักษากติกานี้ไว้ (ดู CLAUDE_CODE_INSTRUCTIONS.md)
  #
  # ระบบเทรดไม่ได้ใช้ Edge Function เลย งานเบื้องหลังอยู่ที่ Vercel Cron
  # ============================================
  deploy-supabase:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_supabase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ============================================
  # Step 4: Deploy to Vercel
  # ============================================
  deploy-vercel:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_vercel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
