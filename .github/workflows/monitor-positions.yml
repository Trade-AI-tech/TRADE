name: Monitor Positions

# ============================================
# ⛔ ตัวจับเวลาอัตโนมัติของ workflow นี้ "ปิดอยู่" — เหลือแค่ปุ่มกดรันเอง
#
# ทำไมถึงปิด:
#   บัญชี Vercel ของเจ้าของโปรเจกต์ถูก PAUSED เพราะใช้เกินโควตาแผน Hobby
#     · Fluid Active CPU        11h57m / 4h
#     · Fast Origin Transfer    28.21GB / 10GB
#   ผลคือ "ทุกโดเมนของโปรเจกต์ตอบ HTTP 402 Payment Required" รวมถึง
#   /api/cron/monitor-positions ที่ deploy สำเร็จแล้วด้วย — โค้ดไม่ได้พัง แต่ไม่มีใครเข้าถึงได้
#   และเจ้าของเลือก "อยู่แผนฟรีต่อ" ไม่อัพเกรด
#
#   ถ้าปล่อย schedule ไว้เฉย ๆ workflow นี้จะยิงไปเจอ 402 แล้ว fail ทุก 30 นาที
#   → หน้า Actions แดงตลอดเวลาจนคนเลิกอ่าน (แล้วจะพลาดของที่แดงเพราะพังจริง)
#   → เผาโควตา Actions ของ repo private ทิ้งเปล่า ๆ เดือนละ ~1,440 นาที
#     โดยไม่ได้ผลลัพธ์อะไรกลับมาเลยสักรอบ
#
# ตอนนี้ใครเป็นตัวจับเวลาจริง:
#   pg_cron บน Supabase (แผน Pro ที่เจ้าของจ่ายอยู่แล้ว) → ยิง Edge Function `monitor-positions`
#   ดู supabase/scripts/schedule_monitor.sql (job ชื่อ monitor-positions-30m)
#   และหัวข้อ "ระบบเฝ้าราคาระหว่างวัน" ใน README.md
#   เส้นทางนั้นไม่ผ่าน Vercel และไม่กินโควตา GitHub Actions เลย
#
# วันไหน Vercel กลับมาใช้ได้ และอยากกลับมาใช้ทางนี้อีก:
#   1. ปลดคอมเมนต์บล็อก schedule ข้างล่าง
#   2. ปิดฝั่ง pg_cron ก่อน (select cron.unschedule('monitor-positions-30m');)
#      ไม่งั้นจะกลายเป็นยิงซ้ำสองทาง เปลืองเปล่า ๆ และ log อ่านยาก
#   3. ทบทวนโควตา Actions ก่อนเลือกความถี่ — repo นี้เป็น PRIVATE จึงถูกคิดนาที
#      (public repo เท่านั้นที่ฟรีไม่จำกัด) แผนฟรีให้ 2,000 นาที/เดือน
#      และ GitHub "ปัดขึ้นเป็นนาทีเต็มต่อ job" ต่อให้ยิง curl เสร็จใน 10 วินาทีก็หัก 1 นาที
#
#        ทุก 15 นาที = 4 × 24 × 30 = 2,880 รอบ/เดือน ≥ 2,880 นาที → เกิน 2,000 แน่นอน
#        ทุก 30 นาที = 2 × 24 × 30 = 1,440 รอบ/เดือน ≈ 1,440 นาที → เหลือ ~560 นาที
#                                                                    ให้ deploy.yml ใช้
#      (deploy.yml รัน npm ci + lint + build ทุก push ตกราว 3–4 นาที/push
#       รวม job check-secrets อีก 1 นาที → ~560 นาทีที่เหลือพอราว 100–140 push/เดือน)
#
#      พอโควตาหมด GitHub จะ "หยุดรัน" workflow เงียบ ๆ ไม่มี notification ไม่มี run สีแดง
#      ผู้ใช้จะเชื่อว่ายังมีตัวเฝ้าราคาให้อยู่ทั้งที่ไม่มีแล้ว — นี่คือเหตุผลที่ pg_cron
#      ถูกเลือกเป็นทางหลัก ไม่ใช่แค่เพราะ Vercel ล่ม
#
# ข้อจำกัดอื่นของ GitHub schedule ที่ต้องรู้ ถ้าคิดจะเปิดกลับ:
#   - ไม่การันตีว่าตรงเวลา ช่วงคนใช้เยอะอาจดีเลย์ 5–15 นาที
#   - schedule มีผลเฉพาะไฟล์ที่อยู่บน branch หลัก แก้บน branch อื่นแล้วยังไม่มีผล
#   - repo เงียบเกิน 60 วัน GitHub จะปิด schedule ให้อัตโนมัติ ต้องเข้าไปกดเปิดเอง
# ============================================

on:
  # ⛔ ปิดไว้ตั้งใจ — อย่าปลดคอมเมนต์จนกว่าจะอ่านหัวไฟล์ครบและปิด pg_cron ฝั่ง Supabase แล้ว
  # schedule:
  #   - cron: '*/30 * * * *'
  #
  # เหลือไว้ให้กดรันเองจากแท็บ Actions — ใช้ไล่ปัญหา/ทดสอบตอน Vercel กลับมาแล้ว
  workflow_dispatch:

# กันรอบใหม่ยิงซ้อนตอนรอบเก่ายังไม่จบ (endpoint เขียนลง trades ตรง ๆ ยิงซ้อนแล้วเปลืองเปล่า)
concurrency:
  group: monitor-positions
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # ไม่ต้อง checkout — งานนี้ยิง HTTP อย่างเดียว ไม่ได้แตะโค้ดใน repo
      - name: เรียก /api/cron/monitor-positions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: 'https://trading-ai-ivory.vercel.app/api/cron/monitor-positions'
        run: |
          # ยังไม่ได้ตั้ง secret → ข้ามไปโดยไม่ทำให้ run แดง
          #
          # ใช้ ::warning:: ไม่ใช่ ::notice:: เพราะสถานะนี้ไม่ใช่ "ยังไม่ได้ตั้งค่าเสริม"
          # route /api/cron/monitor-positions เป็น fail-closed คือปฏิเสธทุกคำขอที่ไม่มี secret
          # ไม่มี CRON_SECRET = เส้นทางนี้ไม่ทำงานเลย ไม่ใช่ทำงานได้แบบไม่มีการป้องกัน
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::ข้ามการยิง — ยังไม่ได้ตั้ง secret CRON_SECRET (Settings → Secrets and variables → Actions) หมายเหตุ: ตัวเฝ้าราคาที่ทำงานจริงตอนนี้คือ pg_cron + Edge Function บน Supabase ซึ่งใช้ MONITOR_SECRET คนละตัวกัน"
            exit 0
          fi

          # เตรียมไฟล์ไว้ก่อน เผื่อ curl ต่อไม่ติดเลยจนไม่ได้เขียนอะไรลงไป
          : > response.txt

          # || true เพื่อให้โค้ดเดินต่อไปพิมพ์ body ได้แม้ curl จะล้มเอง (เช่น DNS พัง/timeout)
          # ตัว exit code จริงตัดสินจาก http_code ข้างล่างอีกที
          status=$(curl -sS -X GET "$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120 \
            -o response.txt \
            -w '%{http_code}') || true

          echo "HTTP ${status:-000}"
          echo "--- response body ---"
          cat response.txt || true
          echo

          # ต้องล้มเมื่อไม่ใช่ 2xx ไม่งั้น endpoint พังเงียบ ๆ แล้วไม่มีใครรู้
          # 402 = บัญชี Vercel ถูก paused เพราะเกินโควตา Hobby (สถานะปัจจุบัน) ไม่ใช่บั๊กของโค้ด
          # 401 = CRON_SECRET ใน GitHub ไม่ตรงกับที่ตั้งไว้บน Vercel (หรือฝั่ง Vercel ยังไม่ได้ตั้ง)
          case "${status:-000}" in
            2??)
              echo "::notice::monitor-positions สำเร็จ (HTTP $status)"
              ;;
            402)
              echo "::error::HTTP 402 — บัญชี Vercel ถูกระงับเพราะใช้เกินโควตาแผน Hobby ทุกโดเมนตอบ 402 อยู่ ทางนี้ยังใช้ไม่ได้จนกว่าโควตาจะรีเซ็ตหรืออัพเกรดแผน · ตัวเฝ้าราคาที่ทำงานจริงตอนนี้คือ pg_cron + Edge Function บน Supabase (ดู README.md)"
              exit 1
              ;;
            *)
              echo "::error::monitor-positions ล้มเหลว (HTTP ${status:-000}) — ดู response body ด้านบน"
              exit 1
              ;;
          esac
