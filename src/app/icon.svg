<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- ไอคอนแอป: แท่งเทียนคู่ เขียวขึ้น-แดงลง (แบบที่ผู้ใช้เลือกจาก 10 ตัวเลือก)
       ไฟล์นี้ Next.js App Router เสิร์ฟเป็น favicon อัตโนมัติตามชื่อไฟล์ icon.svg
       เส้น wick หนา 6px เพื่อให้ยังเห็นชัดตอนย่อเหลือ 16px บนแท็บเบราว์เซอร์ -->
  <rect width="96" height="96" rx="22" fill="#0f1520"/>
  <line x1="36" y1="18" x2="36" y2="78" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <rect x="27" y="31" width="18" height="30" rx="4" fill="#34d399"/>
  <line x1="62" y1="24" x2="62" y2="74" stroke="#FE2C55" stroke-width="6" stroke-linecap="round"/>
  <rect x="53" y="37" width="18" height="22" rx="4" fill="#FE2C55"/>
</svg>
