[project]
id = "your-project-ref"
name = "trading-ai"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]

[db]
port = 54322

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://trading-ai-ivory.vercel.app"]
jwt_expiry = 3600

# ⚠ ไฟล์นี้มีผลเฉพาะ Supabase ที่รันในเครื่อง (supabase start) เท่านั้น
#   โปรเจกต์บนคลาวด์ใช้ค่าจากหน้า Dashboard → Authentication → URL Configuration
#   ต้องไปเพิ่ม https://trading-ai-ivory.vercel.app/** ใน Redirect URLs ที่นั่นด้วย
#   ไม่งั้นลิงก์ยืนยันอีเมลตอนสมัครสมาชิกจะใช้ไม่ได้บนเว็บ production

[auth.external.google]
enabled = true
client_id = ""
secret = ""

# Edge Functions
